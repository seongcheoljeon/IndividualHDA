[project]
name = "individual-hda"
version = "2.2.0"
description = "Personal Houdini digital asset library for Houdini 21+ Qt 6 builds"
requires-python = ">=3.11"

# The panel itself has no pip dependencies: Houdini's Python provides everything.
# Everything below is for development, CI and the optional team server, resolved
# and pinned in uv.lock (`uv sync --group <name>`; pip >= 25.1: `pip install --group <name>`).
[dependency-groups]
# Host-independent tests and static verification tools.
core = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.16,<0.17", "mypy>=2.3,<3"]
# The standalone team server runtime (deploy/*.Dockerfile). Never install into Houdini.
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1"]
# Server development needs neither Houdini nor Qt.
server-test = [{ include-group = "core" }, { include-group = "server" }]
# Full developer environment; PySide6 mirrors Houdini 21's Qt 6 binding for headless tests.
dev = [{ include-group = "core" }, { include-group = "server" }, "PySide6>=6.5.3,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
exclude = ["*_rc.py", "*.md"]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "SIM", "C4", "ANN"]
# E501: the formatter owns line length. B008: Qt idiom `index: QModelIndex = QModelIndex()`.
ignore = ["ANN401", "E501", "B008", "SIM102"]  # SIM102: guard chains stay nested


[tool.mypy]
python_version = "3.11"
follow_imports = "normal"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
files = ["tools", "ihda_server", "libs", "model", "view", "widgets", "main.py", "public.py", "ui_settings.py"]
exclude = ["_rc\\.py$"]

# Generated resource modules are never type-checked; Python layouts are maintained code.
[[tool.mypy.overrides]]
module = ["icons_rc", "libs.darkstyle_rc", "widgets.detail_view.detail_view_rc", "widgets.make_video_info.icons_rc", "widgets.preference.preference_icons_rc", "widgets.rename_ihda.rename_ihda_icons_rc", "widgets.video_player.video_player_icons_rc", "widgets.web_view.web_view_icons_rc"]
ignore_errors = true
