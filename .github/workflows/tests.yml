name: Python and Qt regression tests
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - suite: core
            group: core
          - suite: server
            group: server-test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --locked --only-group ${{ matrix.group }}
      - run: uv run --no-sync python -m tools.check ${{ matrix.suite }}
      - name: Verify isolation from Qt
        run: uv run --no-sync python -c "import importlib.util; assert importlib.util.find_spec('PySide6') is None"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libnss3 libxkbcommon0 libasound2t64 libpulse0
      - name: Install test tools
        run: uv sync --locked --group dev
      - run: uv run --no-sync python -m tools.check lint
      - name: Verify Qt boundary
        run: uv run --no-sync python -m tools.check qt
      - name: Test with coverage
        run: uv run --no-sync python -m tools.check all --coverage
      - name: Verify developer sample panel
        run: uv run --no-sync python -m tools.dev_app --smoke
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            pytest-report.xml
            coverage.xml
          if-no-files-found: ignore

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: ihda_test
          POSTGRES_USER: ihda
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ihda -d ihda_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      QT_QPA_PLATFORM: offscreen
      IHDA_TEST_POSTGRES_URL: postgresql+psycopg://ihda:test-only-password@127.0.0.1:5432/ihda_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Install Qt runtime and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libnss3 libxkbcommon0 libasound2t64 libpulse0 postgresql-client-16
          uv sync --locked --group dev
      - name: Verify contracts and real HTTP against PostgreSQL
        run: uv run --no-sync python -m tools.check postgres
