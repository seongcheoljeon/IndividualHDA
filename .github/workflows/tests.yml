name: Python and Qt regression tests
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libnss3 libxkbcommon0 libasound2t64
      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - name: Test with coverage
        run: >
          python -m pytest -q
          --cov=ihda_server --cov=libs --cov=model --cov=view --cov=widgets --cov=main --cov=public --cov=ui_settings
          --cov-report=term --cov-report=xml --cov-fail-under=60
          --junitxml=pytest-report.xml
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            pytest-report.xml
            coverage.xml
          if-no-files-found: ignore

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: ihda_test
          POSTGRES_USER: ihda
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ihda -d ihda_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      QT_QPA_PLATFORM: offscreen
      IHDA_TEST_POSTGRES_URL: postgresql+psycopg://ihda:test-only-password@127.0.0.1:5432/ihda_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt runtime and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libnss3 libxkbcommon0 libasound2t64 postgresql-client-16
          python -m pip install -r requirements-dev.txt
      - name: Verify contracts and real HTTP against PostgreSQL
        run: python -m pytest -q tests/test_team_library.py tests/test_team_workspace.py tests/test_main_team.py tests/test_library_v2.py tests/test_library_v2_migrations.py tests/test_asset_copy.py tests/test_server_backup.py tests/test_core_refactoring.py
