name: Python and Qt regression tests
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - suite: core
            requirements: requirements-core.txt
          - suite: server
            requirements: requirements-test-server.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: python -m tools.check ${{ matrix.suite }}
      - name: Verify isolation from Qt
        run: python -c "import importlib.util; assert importlib.util.find_spec('PySide6') is None"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libnss3 libxkbcommon0 libasound2t64
      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt
      - run: python -m tools.check lint
      - name: Verify Qt boundary
        run: python -m tools.check qt
      - name: Test with coverage
        run: python -m tools.check all --coverage
      - name: Verify developer sample panel
        run: python -m tools.dev_app --smoke
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            pytest-report.xml
            coverage.xml
          if-no-files-found: ignore

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: ihda_test
          POSTGRES_USER: ihda
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ihda -d ihda_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      QT_QPA_PLATFORM: offscreen
      IHDA_TEST_POSTGRES_URL: postgresql+psycopg://ihda:test-only-password@127.0.0.1:5432/ihda_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt runtime and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libnss3 libxkbcommon0 libasound2t64 postgresql-client-16
          python -m pip install -r requirements-dev.txt
      - name: Verify contracts and real HTTP against PostgreSQL
        run: python -m tools.check postgres
